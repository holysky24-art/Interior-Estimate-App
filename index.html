<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>인테리어 견적 산출기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS: Drag and Drop Library -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <!-- html2pdf.js: PDF Generation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            'tablet': '640px',
          },
          colors: {
            blueBoard: {
              main: '#0267c1',
              sub: '#e9f2fa',
              border: '#b9d2eb',
              active: '#eaf4fd',
              badgeBg: '#dbeafe',
              badgeText: '#0267c1',
              badgeBorder: '#93c5fd'
            },
            greenBoard: {
              main: '#13773b',
              sub: '#edf6f0',
              border: '#badbc5',
              active: '#eef8f2',
              badgeBg: '#dcfce7',
              badgeText: '#13773b',
              badgeBorder: '#86efac'
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
      touch-action: pan-y;
      background-color: #f1f5f9;
      -webkit-text-size-adjust: 100%;
      margin: 0;
      padding: 0;
    }

    /* ================================================================
       [태블릿 절전 복귀 및 Tailwind CDN 누락 대비 필수 구조 순수 CSS 방어]
       ================================================================ */
    #view-calculator {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      width: 100%;
    }

    .calc-icon-wrapper {
      width: 36px !important;
      height: 36px !important;
      min-width: 36px !important;
      min-height: 36px !important;
      max-width: 36px !important;
      max-height: 36px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
      border-radius: 12px;
      background: linear-gradient(to bottom, #1b6cd9, #0d9488);
    }

    .calc-icon-wrapper svg {
      width: 20px !important;
      height: 20px !important;
      max-width: 20px !important;
      max-height: 20px !important;
      display: block !important;
    }

    #boards-container {
      width: 100% !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: stretch !important;
      justify-content: center !important;
      gap: 10px !important;
      box-sizing: border-box !important;
    }

    .board-column {
      flex: 1 1 50% !important;
      width: 50% !important;
      min-width: 0 !important;
      background-color: #ffffff !important;
      border-radius: 12px !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }

    #board-blue {
      border: 1.5px solid #0267c1 !important;
    }
    #board-green {
      border: 1.5px solid #13773b !important;
    }

    .board-header-blue {
      background-color: #0267c1 !important;
      padding: 10px 8px !important;
      text-align: center !important;
    }
    .board-header-green {
      background-color: #13773b !important;
      padding: 10px 8px !important;
      text-align: center !important;
    }

    .sub-header-blue-bg {
      background-color: #e9f2fa !important;
      border-bottom: 1px solid #b9d2eb !important;
      display: flex !important;
    }
    .sub-header-green-bg {
      background-color: #edf6f0 !important;
      border-bottom: 1px solid #badbc5 !important;
      display: flex !important;
    }

    .total-bar-blue {
      background-color: #0267c1 !important;
      padding: 10px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      border-top: 1px solid #1e40af !important;
    }
    .total-bar-green {
      background-color: #13773b !important;
      padding: 10px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      border-top: 1px solid #065f46 !important;
    }

    .col-no-cell {
      width: 36px !important;
      min-width: 36px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .item-row-container {
      display: flex !important;
      align-items: stretch !important;
      min-height: 64px !important;
      border-bottom: 1px solid #b9d2eb;
    }
    #list-wrapper-green .item-row-container {
      border-bottom: 1px solid #badbc5;
    }

    .drop-slot-area {
      min-height: 48px;
      flex: 1 1 auto;
      display: flex !important;
      flex-direction: column !important;
      gap: 3px !important;
      padding: 3px !important;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .drop-slot-blue {
      background-color: #f8fafc !important;
      border: 1px dashed #cbd5e1 !important;
    }

    .drop-slot-green {
      background-color: #f2f9f4 !important;
      border: 1px dashed #badbc5 !important;
    }

    .box-item-card {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 4px !important;
      padding: 4px 6px !important;
      border-radius: 6px !important;
      box-sizing: border-box !important;
    }

    .btn-check-toggle {
      width: 14px !important;
      height: 14px !important;
      min-width: 14px !important;
      min-height: 14px !important;
      border-radius: 9999px !important;
      cursor: pointer;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
    }

    /* ================================================================
       [★ 전체 텍스트 각자 개별 조절 컨트롤 센터 ★]
       ================================================================ */

    /* 1. 최상단 메인 타이틀 ("인테리어 견적 산출기") */
    .header-main-title {
      font-size: 18px !important;
      font-weight: 800 !important;
      color: #0f172a !important;
      letter-spacing: -0.5px !important;
      line-height: 1.2 !important;
    }

    /* 2. 최상단 서브 타이틀 ("실속형 vs 고급형 비교 견적") */
    .header-sub-title {
      font-size: 12px !important;
      font-weight: 600 !important;
      color: #64748b !important;
      letter-spacing: -0.2px !important;
    }

    /* 3-1. 상단 컨트롤 버튼 - 위치 전환 */
    .btn-text-swap {
      font-size: 14px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
    }

    /* 3-2. 상단 컨트롤 버튼 - 전체 선택 */
    .btn-text-select-all {
      font-size: 14px !important;
      font-weight: 600 !important;
      color: #334155 !important;
    }

    /* 3-3. 상단 컨트롤 버튼 - 초기화 */
    .btn-text-reset {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: #be123c !important;
    }

    /* 4-1. 보드 메인 타이틀 - 실속형 */
    .board-title-text-blue {
      font-size: 19px !important;
      font-weight: 700 !important;
      letter-spacing: 2px !important;
      color: #ffffff !important;
      margin: 0 !important;
    }

    /* 4-2. 보드 메인 타이틀 - 고급형 */
    .board-title-text-green {
      font-size: 19px !important;
      font-weight: 700 !important;
      letter-spacing: 2px !important;
      color: #ffffff !important;
      margin: 0 !important;
    }

    /* 5-1. 서브헤더 'NO' 텍스트 (실속형) */
    .sub-header-no-text-blue {
      font-size: 14px !important;
      font-weight: 70
