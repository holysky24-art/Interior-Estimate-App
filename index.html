<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>인테리어 견적 산출기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS: Drag and Drop Library -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <!-- html2pdf.js: PDF Generation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            'tablet': '640px',
          },
          colors: {
            blueBoard: {
              main: '#0267c1',
              sub: '#e9f2fa',
              border: '#b9d2eb',
              active: '#eaf4fd',
              badgeBg: '#dbeafe',
              badgeText: '#0267c1',
              badgeBorder: '#93c5fd'
            },
            greenBoard: {
              main: '#13773b',
              sub: '#edf6f0',
              border: '#badbc5',
              active: '#eef8f2',
              badgeBg: '#dcfce7',
              badgeText: '#13773b',
              badgeBorder: '#86efac'
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
      touch-action: pan-y;
      background-color: #f1f5f9;
      -webkit-text-size-adjust: 100%;
    }

    /* [긴급 방어] Tailwind CDN 지연/절전 복귀 시 SVG 거대화 방지 인라인 고정 */
    .calc-icon-wrapper {
      width: 36px !important;
      height: 36px !important;
      min-width: 36px !important;
      min-height: 36px !important;
      max-width: 36px !important;
      max-height: 36px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
    }

    .calc-icon-wrapper svg {
      width: 20px !important;
      height: 20px !important;
      max-width: 20px !important;
      max-height: 20px !important;
      display: block !important;
    }

    /* ================================================================
       [★ 전체 텍스트 각자 개별 조절 컨트롤 센터 ★]
       ================================================================ */

    /* 1. 최상단 메인 타이틀 ("인테리어 견적 산출기") */
    .header-main-title {
      font-size: 18px !important;
      font-weight: 800 !important;
      color: #0f172a !important;
      letter-spacing: -0.5px !important;
      line-height: 1.2 !important;
    }

    /* 2. 최상단 서브 타이틀 ("실속형 vs 고급형 비교 견적") */
    .header-sub-title {
      font-size: 12px !important;
      font-weight: 600 !important;
      color: #64748b !important;
      letter-spacing: -0.2px !important;
    }

    /* 3-1. 상단 컨트롤 버튼 - 위치 전환 */
    .btn-text-swap {
      font-size: 14px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
    }

    /* 3-2. 상단 컨트롤 버튼 - 전체 선택 */
    .btn-text-select-all {
      font-size: 14px !important;
      font-weight: 600 !important;
      color: #334155 !important;
    }

    /* 3-3. 상단 컨트롤 버튼 - 초기화 */
    .btn-text-reset {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: #be123c !important;
    }

    /* 4-1. 보드 메인 타이틀 - 실속형 */
    .board-title-text-blue {
      font-size: 19px !important;
      font-weight: 700 !important;
      letter-spacing: 2px !important;
      color: #ffffff !important;
    }

    /* 4-2. 보드 메인 타이틀 - 고급형 */
    .board-title-text-green {
      font-size: 19px !important;
      font-weight: 700 !important;
      letter-spacing: 2px !important;
      color: #ffffff !important;
    }

    /* 5-1. 서브헤더 'NO' 텍스트 (실속형) */
    .sub-header-no-text-blue {
      font-size: 14px !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      letter-spacing: 0px !important;
    }

    /* 5-2. 서브헤더 'NO' 텍스트 (고급형) */
    .sub-header-no-text-green {
      font-size: 14px !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      letter-spacing: 0px !important;
    }

    /* 6-1. 서브헤더 '품명' 텍스트 (실속형) */
    .sub-header-name-text-blue {
      font-size: 15px !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      letter-spacing: 1px !important;
    }

    /* 6-2. 서브헤더 '품명' 텍스트 (고급형) */
    .sub-header-name-text-green {
      font-size: 15px !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      letter-spacing: 1px !important;
    }

    /* 7-1. 공종 번호 텍스트 (실속형 측 01, 02, 03 ...) */
    .category-no-text-blue {
      font-size: 13.5px !important;
      font-weight: 800 !important;
      color: #334155 !important;
    }

    /* 7-2. 공종 번호 텍스트 (고급형 측 01, 02, 03 ...) */
    .category-no-text-green {
      font-size: 13.5px !important;
      font-weight: 800 !important;
      color: #334155 !important;
    }

    /* 8-1. 공종 분류명 텍스트 (실속형 측 "벽체공사", "바닥공사" ...) */
    .category-title-text-blue {
      font-size: 15px !important;
      font-weight: 600 !important;
      color: #0f172a !important;
    }

    /* 8-2. 공종 분류명 텍스트 (고급형 측 "벽체공사", "바닥공사" ...) */
    .category-title-text-green {
      font-size: 15px !important;
      font-weight: 600 !important;
    }

    /* 9. 품목 박스 기본 텍스트 ("합지광폭", "실크" 등) */
    .item-text {
      font-size: 16px !important;
      font-weight: 500 !important;
      color: #1e293b !important;
      line-height: 1.3 !important;
    }

    /* 10. 체크(선택)되었을 때 실속형 컬럼 내 품목 텍스트 */
    .item-text-selected-blue {
      color: #0267c1 !important;
      font-weight: 700 !important;
    }

    /* 11. 체크(선택)되었을 때 고급형 컬럼 내 품목 텍스트 */
    .item-text-selected-green {
      color: #13773b !important;
      font-weight: 700 !important;
    }

    /* 12. '실속' 뱃지 버튼 텍스트 및 스타일 */
    .badge-blue-text {
      font-size: 10.5px !important;
      font-weight: 800 !important;
      letter-spacing: -0.3px !important;
      line-height: 1.2 !important;
      padding: 1.5px 5px !important;
      border-radius: 9999px !important;
      background-color: #dbeafe !important;
      color: #0267c1 !important;
      border: 1px solid #93c5fd !important;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* 13. '고급' 뱃지 버튼 텍스트 및 스타일 */
    .badge-green-text {
      font-size: 10.5px !important;
      font-weight: 800 !important;
      letter-spacing: -0.3px !important;
      line-height: 1.2 !important;
      padding: 1.5px 5px !important;
      border-radius: 9999px !important;
      background-color: #dcfce7 !important;
      color: #13773b !important;
      border: 1px solid #86efac !important;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* 14-1. 하단 합계 라벨 텍스트 (실속형 "합계") */
    .total-label-text-blue {
      font-size: 17px !important;
      font-weight: 800 !important;
      letter-spacing: 1px !important;
      color: #ffffff !important;
    }

    /* 14-2. 하단 합계 라벨 텍스트 (고급형 "합계") */
    .total-label-text-green {
      font-size: 17px !important;
      font-weight: 800 !important;
      letter-spacing: 1px !important;
      color: #ffffff !important;
    }

    /* 15-1. 합계 금액 숫자 (실속형) */
    .total-amount-number-blue {
      font-size: 19px !important;
      font-weight: 700 !important;
      letter-spacing: -0.5px !important;
      color: #ffffff !important;
    }

    /* 15-2. 합계 금액 숫자 (고급형) */
    .total-amount-number-green {
      font-size: 19px !important;
      font-weight: 700 !important;
      letter-spacing: -0.5px !important;
      color: #ffffff !important;
    }

    /* 16-1. 합계 금액 단위 "원" (실속형) */
    .total-unit-text-blue {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
    }

    /* 16-2. 합계 금액 단위 "원" (고급형) */
    .total-unit-text-green {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
    }

    /* 17-1. 하단 안내 문구 ("※각 공정별 철거 및 폐기물 별도" - 실속형) */
    .notice-primary-text-blue {
      font-size: 15px !important;
      font-weight: 500 !important;
      color: #1e293b !important;
      line-height: 1.35 !important;
    }

    /* 17-2. 하단 안내 문구 ("※각 공정별 철거 및 폐기물 별도" - 고급형) */
    .notice-primary-text-green {
      font-size: 15px !important;
      font-weight: 500 !important;
      color: #1e293b !important;
      line-height: 1.35 !important;
    }

    /* 18. 하단 보조 안내 문구 */
    .notice-secondary-text {
      font-size: 11px !important;
      font-weight: 600 !important;
      color: #64748b !important;
      line-height: 1.35 !important;
    }

    /* ================================================================
       [★ 견적서 저장 버튼 색상 및 스타일 컨트롤 CSS ★]
       ================================================================ */
    .btn-save-quote-style {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
      border: 1px solid #334155 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25) !important;
    }
    .btn-save-quote-style:hover {
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%) !important;
    }

    /* 견적서 저장 버튼 텍스트 */
    .btn-save-text {
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      letter-spacing: -0.2px !important;
    }

    /* 견적서 저장 버튼 아이콘 */
    .btn-save-icon {
      width: 20px !important;
      height: 20px !important;
      color: #60a5fa !important;
      flex-shrink: 0 !important;
    }

    /* ================================================================
       [★ 견적서 발행정보 입력 전용 텍스트 CSS 컨트롤 센터 ★]
       ================================================================ */
    .form-title-text {
      font-size: 18px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
      letter-spacing: -0.3px !important;
      line-height: 1.3 !important;
    }

    .form-desc-text {
      font-size: 13px !important;
      font-weight: 500 !important;
      color: #94a3b8 !important;
      letter-spacing: -0.2px !important;
      line-height: 1.4 !important;
    }

    .form-btn-back-text {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: #e2e8f0 !important;
    }

    .form-summary-blue-label {
      font-size: 15px !important;
      font-weight: 600 !important;
      color: #1d4ed8 !important;
    }

    .form-summary-blue-amount {
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #1e3a8a !important;
    }

    .form-summary-blue-count {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: #2563eb !important;
    }

    .form-summary-green-label {
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #047857 !important;
    }

    .form-summary-green-amount {
      font-size: 17px !important;
      font-weight: 900 !important;
      color: #064e3b !important;
    }

    .form-summary-green-count {
      font-size: 11px !important;
      font-weight: 600 !important;
      color: #059669 !important;
    }

    .form-label-text {
      font-size: 15px !important;
      font-weight: 600 !important;
      color: #334155 !important;
      margin-bottom: 6px !important;
      display: block !important;
      letter-spacing: -0.2px !important;
    }

    .form-input-text {
      font-size: 13px !important;
      font-weight: 500 !important;
      color: #1e293b !important;
    }

    .form-textarea-text {
      font-size: 13px !important;
      font-weight: 500 !important;
      color: #1e293b !important;
      line-height: 1.4 !important;
    }

    .form-btn-text {
      font-size: 14.5px !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      letter-spacing: -0.2px !important;
    }

    .form-payment-label-text {
      font-size: 14px !important;
      font-weight: 700 !important;
      color: #b91c1c !important;
      margin-bottom: 0px !important;
      display: inline-block !important;
    }

    /* ================================================================
       [★ 날짜 텍스트 바로 옆에 캘린더 아이콘 밀착 배치 및 클릭 반응 CSS ★]
       ================================================================ */
    .date-inline-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 100%;
    }

    .date-input-inline {
      width: 100% !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      cursor: pointer !important;
    }

    .date-input-inline::-webkit-calendar-picker-indicator {
      cursor: pointer !important;
      margin-left: 10px !important;
      margin-right: auto !important;
      padding: 4px !important;
      opacity: 0.85;
      filter: invert(0.2);
    }

    .date-input-inline::-webkit-datetime-edit {
      display: inline-flex !important;
      flex: 0 0 auto !important;
      cursor: pointer !important;
    }

    /* ================================================================
       [★ PDF 견적서 내부 전용 텍스트 CSS 컨트롤 센터 (전체 크기 확대 반영) ★]
       ================================================================ */
    .pdf-title-text {
      font-size: 26px !important;
      font-weight: 900 !important;
      color: #0f172a !important;
      letter-spacing: -0.5px !important;
      line-height: 1.2 !important;
    }

    .pdf-sub-title-text {
      font-size: 14px !important;
      font-weight: 600 !important;
      color: #475569 !important;
      letter-spacing: -0.2px !important;
    }

    .pdf-th-text {
      font-size: 13.5px !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      background-color: #f8fafc !important;
    }

    .pdf-td-text {
      font-size: 13.5px !important;
      font-weight: 600 !important;
      color: #1e293b !important;
      background-color: #ffffff !important;
    }

    .pdf-total-th-text {
      font-size: 14.5px !important;
      font-weight: 800 !important;
      letter-spacing: 0.5px !important;
      color: #ffffff !important;
    }

    .pdf-total-blue-amount {
      font-size: 21px !important;
      font-weight: 800 !important;
      color: #0267c1 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif !important;
    }

    .pdf-total-green-amount {
      font-size: 21px !important;
      font-weight: 800 !important;
      color: #13773b !important;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif !important;
    }

    /* ================================================================
       [기본 레이아웃 및 드래그, 슬롯 구조]
       ================================================================ */
    .draggable-card {
      touch-action: none !important;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .draggable-card:active {
      cursor: grabbing;
    }

    .sortable-ghost {
      opacity: 0.3 !important;
